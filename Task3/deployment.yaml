apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp
  namespace: scaletest
  labels:
    app.kubernetes.io/name: scaletestapp
    app.kubernetes.io/part-of: novamarket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scaletestapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scaletestapp
        app.kubernetes.io/part-of: novamarket
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: scaletestapp
          image: ghcr.io/yandex-practicum/scaletestapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 20Mi
            limits:
              memory: 30Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
