events {}

http {
    log_format rate_limiter '$remote_addr [$time_local] '
                            'client_type="$http_client_type" '
                            'request="$request" status=$status '
                            'zone_status="$limit_req_status"';

    access_log /var/log/nginx/access.log rate_limiter;
    error_log /var/log/nginx/error.log notice;

    upstream backend {
        server 127.0.0.1:8081;
    }

    map $http_client_type $web_limit_key {
        default "";
        web     $binary_remote_addr;
    }

    map $http_client_type $mobile_limit_key {
        default "";
        mobile  $binary_remote_addr;
    }

    map $http_client_type $unknown_limit_key {
        default $binary_remote_addr;
        web     "";
        mobile  "";
    }

    limit_req_zone $web_limit_key zone=web_api:10m rate=50r/s;
    limit_req_zone $mobile_limit_key zone=mobile_api:10m rate=30r/s;
    limit_req_zone $unknown_limit_key zone=unknown_api:10m rate=10r/s;
    limit_req_status 429;

    server {
        listen 8080;

        location /api/ {
            limit_req zone=web_api burst=50 nodelay;
            limit_req zone=mobile_api burst=30 nodelay;
            limit_req zone=unknown_api burst=10 nodelay;

            proxy_set_header Client-Type $http_client_type;
            proxy_pass http://backend;
        }
    }

    server {
        listen 8081;

        location /api/ {
            default_type application/json;

            if ($http_client_type = "web") {
                return 200 '{"status":"success","service":"web_backend","data":"Web application response"}';
            }

            if ($http_client_type = "mobile") {
                return 200 '{"status":"success","service":"mobile_backend","data":"Mobile application response"}';
            }

            return 200 '{"status":"success","service":"default_backend","data":"Default response"}';
        }
    }
}
